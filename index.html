<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Good Karma Cards | Live Good Karma Pulls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stream-display">
    <header class="stream-header">
      <div class="brand-lockup">
        <div class="logo">GK</div>
        <div>
          <div class="eyebrow">GOOD KARMA CARDS</div>
          <h1>GOOD KARMA PULLS</h1>
        </div>
      </div>
      <div class="live-pill"><span class="live-dot"></span> LIVE HITS</div>
    </header>

    <section class="featured-stage" aria-live="polite">
      <div class="featured-image-wrap">
        <img id="featuredImage" class="featured-image" alt="Featured premium hit">
        <div id="featuredTier" class="tier-badge"></div>
      </div>

      <div class="featured-copy">
        <div class="featured-label">FEATURED HIT</div>
        <h2 id="featuredName">Loading premium hits...</h2>
        <div class="featured-meta-row">
          <span id="featuredNumber" class="featured-number"></span>
          <strong id="featuredValue" class="featured-value"></strong>
        </div>
        <div class="rotation-progress"><div id="rotationProgress"></div></div>
        <div id="hitCounter" class="hit-counter"></div>
      </div>
    </section>

    <footer class="stream-footer">
      <div class="footer-box price-box">
        <span class="footer-label">PER PULL</span>
        <strong>$12</strong>
      </div>
      <div class="footer-box">
        <span class="footer-label">CHOOSE</span>
        <strong>A • B • C</strong>
      </div>
      <div class="footer-box">
        <span class="footer-label">PACKS LEFT</span>
        <strong id="packsRemaining">0</strong>
      </div>
      <div class="footer-box guarantee-box">
        <span class="footer-label">EVERY PULL</span>
        <strong>IR OR BETTER</strong>
      </div>
    </footer>

    <div class="status-line">
      <span id="connectionDot" class="connection-dot"></span>
      <span id="connectionText">Connecting...</span>
      <span class="divider">•</span>
      <span id="lastUpdated"></span>
    </div>
  </main>

  <div id="celebration" class="celebration" hidden>
    <div class="confetti"></div>
    <div class="celebration-box">
      <div class="jackpot">JACKPOT HIT!</div>
      <img id="celebrationImage" alt="">
      <h2 id="celebrationName"></h2>
      <div id="celebrationValue"></div>
      <p id="celebrationWinner"></p>
      <small>GOOD KARMA CARDS</small>
    </div>
  </div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
