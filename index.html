=<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Good Karma Pulls | Live</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=clean-1">
</head>

<body>

  <main class="live-page">

    <!-- HEADER: NEVER MOVES -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">GK</div>

        <div class="brand-copy">
          <div class="eyebrow">GOOD KARMA CARDS</div>
          <h1>GOOD KARMA PULLS</h1>
        </div>
      </div>

      <div class="live-pill">
        <span class="live-dot"></span>
        LIVE
      </div>
    </header>


    <!-- CARD IMAGE: FIXED LEFT RECTANGLE -->
    <section class="card-area">
      <div class="card-frame">

        <img
          id="featuredImage"
          class="featured-image"
          alt="Featured premium hit"
        >

        <div
          id="featuredTier"
          class="tier-badge"
        ></div>

      </div>
    </section>


    <!-- GUARANTEE: FIXED RIGHT RECTANGLE -->
    <section class="guarantee-area">
      <div class="guarantee-box">

        <div class="guarantee-line">
          GUARANTEED
        </div>

        <div class="guarantee-line">
          IR OR BETTER
        </div>

        <div class="guarantee-small">
          IN EVERY PACK
        </div>

      </div>
    </section>


    <!-- HIT INFORMATION: FIXED RIGHT RECTANGLE -->
    <section class="hit-area">

      <div class="featured-label">
        FEATURED HIT
      </div>

      <h2 id="featuredName">
        Loading premium hits...
      </h2>

      <div
        id="featuredNumber"
        class="featured-number"
      ></div>

      <div
        id="featuredValue"
        class="featured-value"
      ></div>

      <div class="rotation-track">
        <div id="rotationProgress"></div>
      </div>

      <div
        id="hitCounter"
        class="hit-counter"
      ></div>

    </section>


    <!-- SMALL CONNECTION STATUS -->
    <div class="connection-status">

      <span
        id="connectionDot"
        class="connection-dot"
      ></span>

      <span id="connectionText">
        Connecting...
      </span>

      <span class="separator">•</span>

      <span id="lastUpdated"></span>

    </div>

  </main>


  <!-- FULL SCREEN CELEBRATION -->
  <div
    id="celebration"
    class="celebration"
    hidden
  >

    <div class="celebration-card">

      <div class="celebration-kicker">
        BIG HIT!
      </div>

      <img
        id="celebrationImage"
        alt=""
      >

      <h2 id="celebrationName"></h2>

      <div
        id="celebrationValue"
        class="celebration-value"
      ></div>

      <p id="celebrationWinner"></p>

      <small>
        GOOD KARMA CARDS
      </small>

    </div>

  </div>


  <script src="config.js?v=clean-1"></script>
  <script src="app.js?v=clean-1"></script>

</body>
</html>
